      content="Compara los planes de esquí desde Ecla Archamps para el 12 y 13 de diciembre. Vota tus favoritos y consulta los resultados del grupo."

    <script defer src="archive.js?v=9"></script>
    <script defer src="extras.js?v=18"></script>
    <script defer src="catalogue.js?v=19"></script>
    <script defer src="gear-logistics.js?v=18"></script>
    <script defer src="booking-plans.js?v=18"></script>
    <script defer src="plan-review.js?v=18"></script>
    <script defer src="archive-review.js?v=8"></script>
    <script defer src="access-data.js?v=8"></script>
    <script defer src="lift-hours.js?v=5"></script>

  <body>
    <a class="skip" href="#main">Saltar al contenido</a>
    <section id="auth-gate" aria-label="Acceso por SMS">
      <div class="auth-panel"><div class="ski-loading" role="status">
        <img src="skier-loading.svg?v=29" width="184" height="112" alt="">
        <p>Recuperando tu sesión…</p>
      </div></div>
    </section>
    <div id="shell" hidden>
      <header id="top">
        <div class="top-inner">
          <a href="#planes" class="trip-brand"><img src="icon.svg" width="38" height="38" alt=""><span>Esquí en diciembre</span></a>
          <nav id="nav" aria-label="Navegación principal"></nav>
          <div class="top-tools">
            <button id="theme" class="quiet theme-button" type="button"></button>
            <button class="quiet" id="sourceTop" aria-label="Recursos"></button>
            <button class="quiet" id="account-trigger" aria-haspopup="dialog">Tu cuenta</button>
          </div>
        </div>
      </header>
      <div id="page">
        <main id="main" tabindex="-1"></main>
        <footer>
          <span>12–13 dic 2026 · Ecla Archamps</span
          ><span>Precios consultados el 16 nov 2026</span>
          <span class="ski-availability-note">Los kilómetros corresponden al dominio completo. Las pistas abiertas el 12–13 de diciembre dependerán de la nieve.</span>
        </footer>
      </div>
    </div>
    <div id="voting-notice" role="status" hidden></div>
    <dialog id="profile-dialog" aria-label="Tu cuenta"></dialog>
    <dialog id="sources" aria-labelledby="resourcetitle">
      <div class="dialogtop">
        <h2 id="resourcetitle">Recursos</h2>
        <button class="close" id="close" aria-label="Cerrar recursos">×</button>
      </div>
      <div id="sourcebody"></div>
    </dialog>
    <dialog id="lightbox" aria-label="Imagen ampliada">
      <div class="lighttop">
        <b id="lightlabel"></b
        ><button class="close" id="lightclose" aria-label="Cerrar imagen">
          ×
        </button>
      </div>
      <div class="lightphoto">
        <img id="lightimg" alt="" referrerpolicy="no-referrer" />
      </div>
      <div class="lightfoot">
        <button id="lightprev" aria-label="Imagen anterior">‹</button
        ><span id="lightcount"></span
        ><button id="lightnext" aria-label="Imagen siguiente">›</button>
      </div>
    </dialog>
    <noscript>Activa JavaScript para explorar el visor.</noscript>
  </body>
</html>
