<svg xmlns="http://www.w3.org/2000/svg" width="184" height="112" viewBox="0 0 184 112">
  <style>
    .rider { animation: carve 1.55s ease-in-out infinite; }
    .jump { animation: hop 1.55s infinite; transform-origin: 84px 73px; }
    .legs { animation: flex 1.55s infinite; transform-origin: 76px 56px; }
    .beanie { animation: flutter 500ms ease-in-out infinite alternate; transform-origin: 101px 25px; }
    .wind { animation: slipstream 680ms linear infinite; }
    .snow { animation: slipstream 920ms linear infinite; animation-delay: -420ms; }
    @keyframes carve {
      0%, 100% { transform: translate(-9px, -4px); }
      55% { transform: translate(12px, 5px); }
    }
    @keyframes hop {
      0%, 23%, 78%, 100% { transform: translateY(0); }
      31% { transform: translateY(2px); }
      49% { transform: translateY(-10px) rotate(-5deg); }
      66% { transform: translateY(1px) rotate(2deg); }
    }
    @keyframes flex {
      0%, 22%, 82%, 100% { transform: rotate(0); }
      31%, 68% { transform: rotate(4deg) scaleY(.91); }
      39% { transform: rotate(-4deg) scaleY(1.03); }
      51% { transform: rotate(6deg) scaleY(.87); }
    }
    @keyframes flutter {
      from { transform: rotate(-8deg) skewX(3deg); }
      to { transform: rotate(5deg) skewX(-5deg); }
    }
    @keyframes slipstream {
      from { transform: translate(12px, 5px); opacity: 0; }
      22%, 55% { opacity: .75; }
      to { transform: translate(-21px, -9px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rider, .jump, .legs, .beanie, .wind, .snow { animation: none; }
    }
  </style>
  <g fill="none" stroke="#161616" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 60c42 3 86 25 157 34" stroke-width="1.35" opacity=".27"/>
    <path class="wind" d="m20 49 20 6m-9 5 13 4m79-24 16 5m-13 4 22 7" stroke-width="1.35"/>
    <g class="snow" stroke-width="1.7">
      <path d="m36 72 4 1m9 3 6 2m-28-8 2 1m8-5 2 1m113 18 4 1m-6-8 2 1"/>
    </g>
    <g class="rider" stroke-width="2.5">
      <g class="jump">
        <g class="legs">
          <path d="m79 53 16 9-13 11 9 2m-34-6 62 16q7 2 12-2" stroke-width="1.9" opacity=".45"/>
          <path d="m77 57 21 8-12 12 10 3m-42-7 71 19q7 2 12-2"/>
        </g>
        <path d="M95 37q-12 3-22 15-3 4 4 5l12-9"/>
        <path d="m89 41 13 13 17 3"/>
        <path d="m118 56-53 13m4-5 2 9" stroke-width="1.6"/>
        <path d="M95 27c-1 7 1 11 8 12l7-2 1-4 3-1-3-5"/>
        <g class="beanie">
          <path d="M92 26c0-7 4-12 10-11 6 0 9 5 10 12l-19 2z" fill="#161616" stroke-width="1.8"/>
          <circle cx="99" cy="13" r="2.6" fill="#161616" stroke="none"/>
        </g>
      </g>
    </g>
  </g>
</svg>
