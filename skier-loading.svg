<svg xmlns="http://www.w3.org/2000/svg" width="184" height="112" viewBox="0 0 184 112">
  <style>
    .rider { animation: carve 1.55s ease-in-out infinite; }
    .wind { animation: slipstream 680ms linear infinite; }
    .snow { animation: slipstream 920ms linear infinite; animation-delay: -420ms; }
    @keyframes carve {
      0%, 100% { transform: translate(-9px, -4px); }
      55% { transform: translate(12px, 5px); }
    }
    @keyframes slipstream {
      from { transform: translate(12px, 5px); opacity: 0; }
      22%, 55% { opacity: .75; }
      to { transform: translate(-21px, -9px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rider, .wind, .snow { animation: none; }
    }
  </style>
  <g fill="none" stroke="#161616" stroke-linecap="round" stroke-linejoin="round">
